! ==============================================================================
! UNIVERSITY RESEARCH NETWORK - CISCO CATALYST 3560 CORE SWITCH SECURITY ACLs
! Course: BACSE203 P Computer Networks Lab
! Role: Member 2 - Security Policy, Access Control Matrix & Traffic Filtering
! Target Device: CORE-SW (Cisco Catalyst 3560-24PS)
! File: configs/CORE-SW_security_acls.cfg
! Description: Extended Named Access Control Lists applied INBOUND on CORE-SW SVIs
! ==============================================================================

configure terminal

! ------------------------------------------------------------------------------
! 1. Extended Named ACL: ACL-VLAN10-STUDENTS-IN
! Applied: Inbound on interface Vlan10
! Scope: Student hosts (192.168.10.0/24)
! Policy: Permit DHCP, DNS, Internet Web/HTTPS, Remediation, Public Research Web.
!         Deny SRV-ADMIN, SRV-DB, Switch SSH Mgmt, and Admin/Faculty/Research VLANs.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN10-STUDENTS-IN
 ! Rule 1-2: Essential DHCP Preservation (UDP 67/68)
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-4: Controlled ICMP Diagnostics (Gateway & Performance Probes)
 permit icmp 192.168.10.0 0.0.0.255 any echo
 permit icmp 192.168.10.0 0.0.0.255 any echo-reply
 permit icmp 192.168.10.0 0.0.0.255 any unreachable
 permit icmp 192.168.10.0 0.0.0.255 any time-exceeded
 ! Rule 5-8: Authorized DNS Resolution (Internet & Remediation)
 permit udp 192.168.10.0 0.0.0.255 host 203.0.113.2 eq domain
 permit tcp 192.168.10.0 0.0.0.255 host 203.0.113.2 eq domain
 permit udp 192.168.10.0 0.0.0.255 host 192.168.50.13 eq domain
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.50.13 eq domain
 ! Rule 9-10: Simulated Internet Web Browsing via EDGE-R NAT
 permit tcp 192.168.10.0 0.0.0.255 host 203.0.113.2 eq www
 permit tcp 192.168.10.0 0.0.0.255 host 203.0.113.2 eq 443
 ! Rule 11-12: Authorized Server Access (Remediation & Public Research HTTP)
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.50.13 eq www
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.50.10 eq www
 ! Rule 13: Core Transit Routing Subnet Preservation
 permit ip 192.168.10.0 0.0.0.255 10.0.0.0 0.0.0.3
 ! Rule 14-19: Explicit Security Denials (Protection of Critical Infrastructure)
 deny ip 192.168.10.0 0.0.0.255 host 192.168.50.12
 deny ip 192.168.10.0 0.0.0.255 host 192.168.50.11
 deny tcp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 22
 deny ip 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny ip 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny ip 192.168.10.0 0.0.0.255 192.168.30.0 0.0.0.255
 ! Rule 20: Default Deny All Remaining Traffic
 deny ip any any
exit

! ------------------------------------------------------------------------------
! 2. Extended Named ACL: ACL-VLAN20-FACULTY-IN
! Applied: Inbound on interface Vlan20
! Scope: Faculty hosts (192.168.20.0/24)
! Policy: Permit DHCP, DNS, Internet Web/HTTPS, Research Server (HTTP/HTTPS),
!         Remediation Server. Deny SRV-ADMIN and Switch SSH Management.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN20-FACULTY-IN
 ! Rule 1-2: Essential DHCP Preservation
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-6: ICMP Diagnostics
 permit icmp 192.168.20.0 0.0.0.255 any echo
 permit icmp 192.168.20.0 0.0.0.255 any echo-reply
 permit icmp 192.168.20.0 0.0.0.255 any unreachable
 permit icmp 192.168.20.0 0.0.0.255 any time-exceeded
 ! Rule 7-10: DNS Resolution
 permit udp 192.168.20.0 0.0.0.255 host 203.0.113.2 eq domain
 permit tcp 192.168.20.0 0.0.0.255 host 203.0.113.2 eq domain
 permit udp 192.168.20.0 0.0.0.255 host 192.168.50.13 eq domain
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.50.13 eq domain
 ! Rule 11-12: Internet Web/HTTPS Access
 permit tcp 192.168.20.0 0.0.0.255 host 203.0.113.2 eq www
 permit tcp 192.168.20.0 0.0.0.255 host 203.0.113.2 eq 443
 ! Rule 13-15: Internal Departmental Server Access
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.50.10 eq www
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.50.10 eq 443
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.50.13 eq www
 ! Rule 16: Transit Subnet Preservation
 permit ip 192.168.20.0 0.0.0.255 10.0.0.0 0.0.0.3
 ! Rule 17-19: Explicit Security Denials
 deny tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 22
 deny ip 192.168.20.0 0.0.0.255 host 192.168.50.12
 deny ip 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255
 ! Rule 20: Default Deny All Remaining Traffic
 deny ip any any
exit

! ------------------------------------------------------------------------------
! 3. Extended Named ACL: ACL-VLAN30-RESEARCH-IN
! Applied: Inbound on interface Vlan30
! Scope: Research workstations (192.168.30.0/24)
! Policy: Permit DHCP, DNS, Internet Web/HTTPS, SRV-RESEARCH (HTTP/HTTPS),
!         SRV-DB (FTP 20/21), Remediation. Deny SRV-ADMIN and Switch SSH Mgmt.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN30-RESEARCH-IN
 ! Rule 1-2: Essential DHCP Preservation
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-6: ICMP Diagnostics & Performance Probes (Scenario performance)
 permit icmp 192.168.30.0 0.0.0.255 any echo
 permit icmp 192.168.30.0 0.0.0.255 any echo-reply
 permit icmp 192.168.30.0 0.0.0.255 any unreachable
 permit icmp 192.168.30.0 0.0.0.255 any time-exceeded
 ! Rule 7-10: DNS Resolution
 permit udp 192.168.30.0 0.0.0.255 host 203.0.113.2 eq domain
 permit tcp 192.168.30.0 0.0.0.255 host 203.0.113.2 eq domain
 permit udp 192.168.30.0 0.0.0.255 host 192.168.50.13 eq domain
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.13 eq domain
 ! Rule 11-12: Internet Web/HTTPS Access
 permit tcp 192.168.30.0 0.0.0.255 host 203.0.113.2 eq www
 permit tcp 192.168.30.0 0.0.0.255 host 203.0.113.2 eq 443
 ! Rule 13-16: Research Core Services Access (Scenario authorized)
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.10 eq www
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.10 eq 443
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.11 eq ftp
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.11 eq ftp-data
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.50.13 eq www
 ! Rule 17: Transit Subnet Preservation
 permit ip 192.168.30.0 0.0.0.255 10.0.0.0 0.0.0.3
 ! Rule 18-20: Explicit Security Denials
 deny tcp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 22
 deny ip 192.168.30.0 0.0.0.255 host 192.168.50.12
 deny ip 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255
 ! Rule 21: Default Deny All Remaining Traffic
 deny ip any any
exit

! ------------------------------------------------------------------------------
! 4. Extended Named ACL: ACL-VLAN40-ADMIN-IN
! Applied: Inbound on interface Vlan40
! Scope: Administration hosts (192.168.40.0/24) & POLICY-HOST (192.168.40.50)
! Policy: Permit DHCP, DNS, Internet, full Server farm access (including SRV-ADMIN),
!         and POLICY-HOST SSH to switch management interfaces.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN40-ADMIN-IN
 ! Rule 1-2: Essential DHCP Preservation
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-6: ICMP Diagnostics
 permit icmp 192.168.40.0 0.0.0.255 any echo
 permit icmp 192.168.40.0 0.0.0.255 any echo-reply
 permit icmp 192.168.40.0 0.0.0.255 any unreachable
 permit icmp 192.168.40.0 0.0.0.255 any time-exceeded
 ! Rule 7-9: Management Access Protection (POLICY-HOST to Switch Management IPs)
 permit tcp host 192.168.40.50 host 192.168.40.1 eq 22
 permit tcp host 192.168.40.50 host 192.168.40.21 eq 22
 permit tcp host 192.168.40.50 host 192.168.40.22 eq 22
 ! Rule 10: Admin Subnet Management SSH
 permit tcp 192.168.40.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 22
 ! Rule 11-14: Full Access to Campus Enterprise Server Farm
 permit ip 192.168.40.0 0.0.0.255 host 192.168.50.12
 permit ip 192.168.40.0 0.0.0.255 host 192.168.50.10
 permit ip 192.168.40.0 0.0.0.255 host 192.168.50.11
 permit ip 192.168.40.0 0.0.0.255 host 192.168.50.13
 ! Rule 15-18: DNS & Internet Web Access
 permit udp 192.168.40.0 0.0.0.255 host 203.0.113.2 eq domain
 permit tcp 192.168.40.0 0.0.0.255 host 203.0.113.2 eq domain
 permit tcp 192.168.40.0 0.0.0.255 host 203.0.113.2 eq www
 permit tcp 192.168.40.0 0.0.0.255 host 203.0.113.2 eq 443
 ! Rule 19: Transit Subnet Preservation
 permit ip 192.168.40.0 0.0.0.255 10.0.0.0 0.0.0.3
 ! Rule 20: General Inter-VLAN Administration
 permit ip 192.168.40.0 0.0.0.255 192.168.0.0 0.0.255.255
 ! Rule 21: Default Deny All Remaining Traffic
 deny ip any any
exit

! ------------------------------------------------------------------------------
! 5. Extended Named ACL: ACL-VLAN60-RESTRICTED-IN
! Applied: Inbound on interface Vlan60
! Scope: Contained endpoints in Restricted state (192.168.60.0/24)
! Policy: Permit DHCP and HTTP/DNS access ONLY to SRV-REMEDIATE (192.168.50.13).
!         Deny all other internal servers, other VLANs, switch SSH, and Internet.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN60-RESTRICTED-IN
 ! Rule 1-2: Essential DHCP Preservation for Containment Re-addressing
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-4: Local Gateway ICMP Ping
 permit icmp 192.168.60.0 0.0.0.255 host 192.168.60.1 echo
 permit icmp 192.168.60.0 0.0.0.255 host 192.168.60.1 echo-reply
 ! Rule 5-6: Remediation DNS Resolution Only
 permit udp 192.168.60.0 0.0.0.255 host 192.168.50.13 eq domain
 permit tcp 192.168.60.0 0.0.0.255 host 192.168.50.13 eq domain
 ! Rule 7: Remediation Web Portal HTTP Access (Scenario recovery)
 permit tcp 192.168.60.0 0.0.0.255 host 192.168.50.13 eq www
 ! Rule 8-15: Strict Containment Denials
 deny ip 192.168.60.0 0.0.0.255 host 192.168.50.12
 deny ip 192.168.60.0 0.0.0.255 host 192.168.50.10
 deny ip 192.168.60.0 0.0.0.255 host 192.168.50.11
 deny tcp 192.168.60.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 22
 deny ip 192.168.60.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny ip 192.168.60.0 0.0.0.255 192.168.10.0 0.0.0.255
 deny ip 192.168.60.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny ip 192.168.60.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny ip 192.168.60.0 0.0.0.255 203.0.113.0 0.0.0.3
 ! Rule 16: Default Deny All Remaining Traffic
 deny ip any any
exit

! ------------------------------------------------------------------------------
! 6. Extended Named ACL: ACL-VLAN70-QUARANTINE-IN
! Applied: Inbound on interface Vlan70
! Scope: Fully isolated endpoints in Quarantine state (192.168.70.0/24)
! Policy: Permit DHCP only. Deny all server, inter-VLAN, management, and Internet.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN70-QUARANTINE-IN
 ! Rule 1-2: Essential DHCP Preservation for Quarantine Re-addressing
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-4: Local Gateway ICMP Ping
 permit icmp 192.168.70.0 0.0.0.255 host 192.168.70.1 echo
 permit icmp 192.168.70.0 0.0.0.255 host 192.168.70.1 echo-reply
 ! Rule 5: Total Quarantine Lockdown (Default Deny All)
 deny ip any any
exit

! ------------------------------------------------------------------------------
! 7. Extended Named ACL: ACL-VLAN50-SERVERS-IN
! Applied: Inbound on interface Vlan50
! Scope: Server farm egress traffic (192.168.50.0/24)
! Policy: Permit established TCP responses, DNS replies, and authorized replies.
! ------------------------------------------------------------------------------
ip access-list extended ACL-VLAN50-SERVERS-IN
 ! Rule 1-2: DHCP Preservation
 permit udp any any eq bootps
 permit udp any any eq bootpc
 ! Rule 3-5: ICMP Diagnostic Replies
 permit icmp 192.168.50.0 0.0.0.255 any echo-reply
 permit icmp 192.168.50.0 0.0.0.255 any unreachable
 permit icmp 192.168.50.0 0.0.0.255 any time-exceeded
 ! Rule 6-7: Web Server Outbound Responses (HTTP/HTTPS established)
 permit tcp 192.168.50.0 0.0.0.255 eq www any established
 permit tcp 192.168.50.0 0.0.0.255 eq 443 any established
 ! Rule 8-9: Database Server Outbound Responses (FTP established)
 permit tcp 192.168.50.0 0.0.0.255 eq ftp any established
 permit tcp 192.168.50.0 0.0.0.255 eq ftp-data any established
 ! Rule 10: Remediation Server DNS Replies
 permit udp host 192.168.50.13 eq domain any
 ! Rule 11: General Server Response Communication
 permit ip 192.168.50.0 0.0.0.255 any
 ! Rule 12: Default Deny All Remaining Traffic
 deny ip any any
exit

! ==============================================================================
! 8. Interface Binding: Attach ACLs Inbound to SVIs
! ==============================================================================
interface Vlan10
 ip access-group ACL-VLAN10-STUDENTS-IN in
!
interface Vlan20
 ip access-group ACL-VLAN20-FACULTY-IN in
!
interface Vlan30
 ip access-group ACL-VLAN30-RESEARCH-IN in
!
interface Vlan40
 ip access-group ACL-VLAN40-ADMIN-IN in
!
interface Vlan50
 ip access-group ACL-VLAN50-SERVERS-IN in
!
interface Vlan60
 ip access-group ACL-VLAN60-RESTRICTED-IN in
!
interface Vlan70
 ip access-group ACL-VLAN70-QUARANTINE-IN in
!

end
write memory
